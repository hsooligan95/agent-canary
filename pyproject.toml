[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcanary"
version = "0.1.0"
description = "AgentCanary: CI for agent behavior -- golden-suite regression gating for prompt/config/model changes, plus drift detection."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
agentcanary = "agentcanary.cli:main"

[tool.setuptools.packages.find]
include = ["agentcanary*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
